name: ci
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pyyaml
      - run: npm install --workspaces=false || true
      - run: npm run validate
  api:
    runs-on: ubuntu-latest
    env:
      FLAG_HMAC_SECRET: ci-only-secret-32-bytes-minimum
      ALLOW_DEV_MINT: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r services/api/requirements.txt
      - run: python -m pytest services/api/tests/ -q
        working-directory: services/api
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: npm run typecheck --workspace=web
      - run: npm run build --workspace=web
  orchestrator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r services/orchestrator/requirements.txt
      - run: python -m pytest services/orchestrator/tests/test_policy.py -q
        working-directory: services/orchestrator
        env:
          ALLOW_UNSIGNED_MANIFESTS: "true"
          ALLOW_DEV_DIGESTS: "true"
      - run: docker build -t local-mpesa-mock labs/mocks/mpesa
      - run: python -m pytest services/orchestrator/tests/test_isolation.py -q
        working-directory: services/orchestrator
        env:
          ALLOW_UNSIGNED_MANIFESTS: "true"
          ALLOW_DEV_DIGESTS: "true"
  curriculum:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pyyaml
      - run: npm run validate
      - run: python -m pytest labs/tests/ -q
