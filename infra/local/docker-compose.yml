services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab_dev_only
      POSTGRES_DB: lab
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ../../services/api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_URL: postgresql://lab:lab_dev_only@postgres:5432/lab
      FLAG_HMAC_SECRET: ${FLAG_HMAC_SECRET:?set FLAG_HMAC_SECRET in .env}
      ALLOW_DEV_MINT: "true" # local only — production overlay forces false
      LABS_ROOT: /labs
      ORCHESTRATOR_URL: http://host.docker.internal:8001
      ORCHESTRATOR_TOKEN: ${ORCHESTRATOR_TOKEN:?set ORCHESTRATOR_TOKEN in .env}
      RELAY_HOST: host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - path: ../../.env
        required: false
    volumes:
      - ../../labs:/labs:ro
    ports:
      - "8000:8000"
    networks: [default, labnet]
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/healthz\")'"]
      interval: 10s
      timeout: 3s
      retries: 10

  orchestrator:
    build: ../../services/orchestrator
    restart: unless-stopped
    # Host mode (local only): relays bind host loopback for learner tools.
    # Sole holder of the Docker socket — api/web never mount it.
    network_mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ../../labs:/labs:ro
    environment:
      ORCHESTRATOR_TOKEN: ${ORCHESTRATOR_TOKEN:?set ORCHESTRATOR_TOKEN in .env}
      ALLOW_UNSIGNED_MANIFESTS: "true" # local only — production requires signatures
      ALLOW_DEV_DIGESTS: "true" # local only — production requires pinned digests
      LABS_ROOT: /labs
      ORCH_ALLOWLIST: local-mpesa-mock,local-lab-web-http-01,local-lab-web-cookies-01,local-lab-web-headers-01,local-lab-web-authz-01,local-lab-web-report-01
      ORCH_IMAGE_MAP: '{"local/kingaweb-mpesa-mock": "local-mpesa-mock", "local/kingaweb-web-http-01": "local-lab-web-http-01", "local/kingaweb-web-cookies-01": "local-lab-web-cookies-01", "local/kingaweb-web-headers-01": "local-lab-web-headers-01", "local/kingaweb-web-authz-01": "local-lab-web-authz-01", "local/kingaweb-web-report-01": "local-lab-web-report-01"}'
    env_file:
      - path: ../../.env
        required: false
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8001/healthz\")'"]
      interval: 10s
      timeout: 3s
      retries: 10

  tutor-stub:
    build: ../../services/tutor
    restart: unless-stopped
    ports:
      - "5008:5008"
    networks: [labnet]
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:5008/healthz\")'"]
      interval: 10s
      timeout: 3s
      retries: 5

  mpesa-mock:
    build: ../../labs/mocks/mpesa
    restart: unless-stopped
    environment:
      MPESA_CALLBACK_SECRET: ${FLAG_HMAC_SECRET:-dev-only-mock-secret}
    env_file:
      - path: ../../.env
        required: false
    ports:
      - "5009:5009"
    networks: [labnet]
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:5009/healthz\")'"]
      interval: 10s
      timeout: 3s
      retries: 5

networks:
  labnet:

volumes:
  postgres-data:
  redis-data:
