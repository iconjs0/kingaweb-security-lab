services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab_dev_only
      POSTGRES_DB: lab
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ../../services/api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_URL: postgresql://lab:lab_dev_only@postgres:5432/lab
      FLAG_HMAC_SECRET: ${FLAG_HMAC_SECRET:?set FLAG_HMAC_SECRET in .env}
      ALLOW_DEV_MINT: "true" # local only — production overlay forces false
      LABS_ROOT: /labs
    env_file:
      - path: ../../.env
        required: false
    volumes:
      - ../../labs:/labs:ro
    ports:
      - "8000:8000"
    networks: [default, labnet]
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/healthz\")'"]
      interval: 10s
      timeout: 3s
      retries: 10

  tutor-stub:
    build: ../../services/tutor
    restart: unless-stopped
    ports:
      - "5008:5008"
    networks: [labnet]
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:5008/healthz\")'"]
      interval: 10s
      timeout: 3s
      retries: 5

  mpesa-mock:
    build: ../../labs/mocks/mpesa
    restart: unless-stopped
    environment:
      MPESA_CALLBACK_SECRET: ${FLAG_HMAC_SECRET:-dev-only-mock-secret}
    env_file:
      - path: ../../.env
        required: false
    ports:
      - "5009:5009"
    networks: [labnet]
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:5009/healthz\")'"]
      interval: 10s
      timeout: 3s
      retries: 5

networks:
  labnet:

volumes:
  postgres-data:
  redis-data:
