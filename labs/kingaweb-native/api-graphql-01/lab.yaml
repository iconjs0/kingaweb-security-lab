apiVersion: lab.kingaweb.io/v1
kind: Lab
metadata:
  id: api-graphql-01
  slug: api-graphql-01
  version: 0.1.0
  title: "API GraphQL: Field Authz + Query Cost"
  summary: "Read another user's ssn field and run an unbounded nested query, then gate both."
  difficulty: intermediate
  timeMinutes: 45
  author: "platform"
  reviewer: "tbd"
tracks: [api]
owasp:
  web: []
  api: ["API3:2023-Broken Object Property Level Authorization", "API4:2023-Unrestricted Resource Consumption"]
cwe: [639, 770]
prerequisites: [web-http-01, api-bola-01]
topology: "single container: tiny graphql (stdlib python, hand-rolled)"
targets:
  - name: graphapi
    image: "local/kingaweb-api-graphql-01@sha256:LOCAL_BUILD"
    ports: [8080]
    healthcheck: { path: /healthz, port: 8080, timeoutSeconds: 5 }
    resources: { cpu: "0.25", memory: "128Mi", pids: 32, diskMb: 128 }
    readonlyFs: true
network: { egress: deny, allowMocks: [] }
session: { ttlMinutes: 45, maxExtendOnceMinutes: 15 }
objectives:
  - id: graphql-ssn
    title: "Read bob's ssn field as alice"
    flag: { validator: hmac, objectiveId: graphql-ssn }
    evidenceRequired: true
  - id: graphql-deep
    title: "Execute a nesting-depth-6+ query successfully"
    flag: { validator: hmac, objectiveId: graphql-deep }
    evidenceRequired: true
hints:
  - { level: 1, text: "Introspect by asking: which fields exist on user? Try ssn...", cost: 5 }
  - { level: 2, text: "Nest user{user{...}} deeper and watch timing; depth 6 pays...", cost: 15 }
guidedSteps:
  - { checkpoint: map, title: "Schema", body: "GET /healthz schema; login; query own fields." }
  - { checkpoint: test, title: "Over-fetch + over-nest", body: "Foreign ssn + depth-6 query; capture both flags." }
  - { checkpoint: fix, title: "Remediate", body: "Field allowlist + depth cap 4; both blocked." }
remediation: { summary: "Field-level authz + query depth/cost analysis on every operation.", retest: "Foreign ssn → 403; depth 6 → 400." }
blueTeam:
  logBundle: "blue-team.json"
  detectionGoal: "Alert on sensitive-field selection and deep nesting"
  sampleQuerySplunk: 'index=lab uri="/graphql" (ssn OR depth>4) | stats count by caller'
tutorPolicy: { guidedMaxLevel: 2, challengeDiscloses: methodology-only, assessmentDiscloses: none }
ctf: { basePoints: 400, floor: 100, firstBloodBonus: true }
resetStrategy: recreate
