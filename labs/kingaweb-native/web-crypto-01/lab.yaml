apiVersion: lab.kingaweb.io/v1
kind: Lab
metadata:
  id: web-crypto-01
  slug: web-crypto-01
  version: 0.1.0
  title: "Crypto: The Reset Token You Can Mint"
  summary: "Forge a predictable password-reset token, then sign and expire them."
  difficulty: intermediate
  timeMinutes: 45
  author: "platform"
  reviewer: "tbd"
tracks: [web]
owasp:
  web: ["A02:2021-Cryptographic Failures", "A07:2021-Identification and Authentication Failures"]
  api: ["API2:2023-Broken Authentication"]
cwe: [330, 639]
prerequisites: [web-cookies-01]
topology: "single container: reset flow (stdlib python)"
targets:
  - name: resetapp
    image: "local/kingaweb-web-crypto-01@sha256:LOCAL_BUILD"
    ports: [8080]
    healthcheck: { path: /healthz, port: 8080, timeoutSeconds: 5 }
    resources: { cpu: "0.25", memory: "128Mi", pids: 32, diskMb: 128 }
    readonlyFs: true
network: { egress: deny, allowMocks: [] }
session: { ttlMinutes: 45, maxExtendOnceMinutes: 15 }
objectives:
  - id: forge-reset
    title: "Mint admin's reset token yourself, change the password"
    flag: { validator: hmac, objectiveId: forge-reset }
    evidenceRequired: true
hints:
  - { level: 1, text: "Request a reset for user. Decode the token — what feeds it?...", cost: 5 }
  - { level: 2, text: "Rebuild admin's token from username + timestamp...", cost: 15 }
guidedSteps:
  - { checkpoint: map, title: "Token", body: "Request user token; decode and study its parts." }
  - { checkpoint: test, title: "Forge", body: "Mint admin's token; reset the password; capture the flag." }
  - { checkpoint: fix, title: "Remediate", body: "Random HMAC tokens + expiry; forged token → 403." }
remediation: { summary: "CSPRNG tokens, HMAC binding, single-use + short expiry.", retest: "Self-minted token → 403." }
blueTeam:
  logBundle: "blue-team.json"
  detectionGoal: "Alert on reset-confirm calls without a matching issued token"
  sampleQuerySplunk: 'index=lab uri="/reset/confirm" status=200 | stats count by user'
tutorPolicy: { guidedMaxLevel: 2, challengeDiscloses: methodology-only, assessmentDiscloses: none }
ctf: { basePoints: 400, floor: 100, firstBloodBonus: true }
resetStrategy: recreate
